[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartbutler"
version = "0.1.0"
description = "SmartButler - a general-purpose agent with personality, memory, and context awareness"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "SmartButler Team" }]

# 基础设施层（Phase 0）的最小依赖。
# 后续每个模块落地时再追加依赖（langgraph、fastapi、typer 等），
# 避免一次性引入未使用的库掩盖架构边界。
dependencies = [
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "structlog>=24.1,<25.0",
    "httpx>=0.27,<1.0",
    # Phase 1.5: LangChain LLM 适配器依赖。
    # langchain-core: BaseChatModel / 消息类型 / 工具绑定抽象。
    # langchain-openai: ChatOpenAI 实现,DeepSeek / Qwen / OpenRouter 等
    #                  OpenAI 兼容协议厂商均可复用该类（通过 base_url 切换）。
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint>=4.1,<5.0",
    "langgraph-prebuilt>=1.0,<2.0",
    # Phase 6.1: SqliteSaver 让短期记忆(checkpointer 状态)跨进程持久化。
    # 默认 InMemorySaver 重启即丢,Phase 6b Proactive 真实化时必须能查"最近一次对话",
    # 故直接接 SqliteSaver,不复用 in-memory 占位。
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    # Phase 5: Skill loader 基于 deepagents 中间件。
    # 0.7.0~0.7.6 早期版本只支持 langchain 0.3,跟我们现在 langchain 1.x 不兼容;
    # 0.7.20+ 已升级依赖要求,实测 0.7.23 与 langchain 1.4.3 / langchain-core 1.6.8
    # 共存正常。下界锁到 0.7.20 避免 pip 解图时去试早期版本,把 resolution-too-deep
    # 触发面缩到最小。
    "deepagents>=0.7.20,<0.8",
    # Phase 6: 长期记忆层。qdrant-client 用嵌入式模式 (path=...) 不需要起
    # 独立服务;langmem 提供 LangGraph 集成的记忆管理抽象。
    "qdrant-client>=1.19,<2.0",
    "langmem>=0.0.30,<0.1",
    # Windows 上 zoneinfo 走 PEP 615 fallback,需要 tzdata 包提供 IANA 时区数据库。
    # Linux/macOS 自带,装上无副作用;Windows 上无此包则 ZoneInfo("Asia/Shanghai") 直接抛
    # ZoneInfoNotFoundError,get_current_time 会被迫回退 UTC,LLM 自己手动 +8 兜底。
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "respx>=0.21,<1.0",
]
all = []

[tool.hatch.build.targets.wheel]
packages = ["smartbutler"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_redundant_casts = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# TestTimeAgent 这个名字 (以 Test 开头) 是有意义的产品命名 —— "Test" 表示脚手架。
# pytest 默认会把它当成 test class 收集,但它不是测试,抑制这条警告。
filterwarnings = [
    "ignore:cannot collect test class:pytest.PytestCollectionWarning",
]
markers = [
    "integration: end-to-end tests that hit external services (skipped by default; opt-in via -m integration)",
    "e2e: end-to-end streaming/connectivity tests against live LLM APIs (skipped by default; opt-in via -m e2e)",
]
